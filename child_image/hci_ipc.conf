# Network core (SDC controller) config.

# Two advertising set slots in the SDC (one per identity).
CONFIG_BT_CTLR_ADV_SET=2

# Enable extended advertising in the SDC controller.
CONFIG_BT_CTLR_ADV_EXT=y

# Match app core MAX_CONN so the SDC allocates enough controller link slots.
CONFIG_BT_MAX_CONN=3

# In hci_ipc, BT_HCI_RAW forces BT_CENTRAL=y which drops this default to 1.
# Two connectable advertising sets each reserve a peripheral slot, so we need
# at least 2 here or the second bt_le_ext_adv_start returns -12 (0x0d).
CONFIG_BT_CTLR_SDC_PERIPHERAL_COUNT=2

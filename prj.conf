CONFIG_GPIO=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Virtual Mouse"
CONFIG_BT_DEVICE_APPEARANCE=962

# HID over GATT (HOGP)
CONFIG_BT_HIDS=y
CONFIG_BT_CONN_CTX=y

# Device Information Service
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y

# Security and bonding
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# IMU — I2C bus only; LSM6DSO is accessed directly in imu.c (no sensor driver)
CONFIG_I2C=y

# GATT pool — HIDS needs ~6 chrc slots; default is 5, so it always exhausted
CONFIG_BT_GATT_CHRC_POOL_SIZE=10

# BLE TX buffers — default (3) fills up quickly when notifying at high IMU rates.
# More buffers lets the stack queue more packets, reducing dropped notifications.
CONFIG_BT_BUF_ACL_TX_COUNT=20

# Extended advertising — two advertising sets, one per BLE identity:
#   Identity 0 "Virtual Mouse" — HID, bonds with OS.
#   Identity 1 "VM-Raw"        — raw IMU, connects to Python script.
# Identity 1's advertising set runs independently alongside identity 0's
# connection; no re-advertising problem.
# Requires CONFIG_BT_EXT_ADV=y + CONFIG_BT_EXT_ADV_MAX_ADV_SET=2 in BOTH
# app core (here) and network core (child_image/hci_ipc.conf).
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
CONFIG_BT_ID_MAX=2

# EATT — macOS uses Enhanced ATT for larger MTU; batch=3 needs 48-byte payload.
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_L2CAP_ECRED=y
CONFIG_BT_EATT=y
CONFIG_BT_L2CAP_TX_MTU=100

# Three conn slots: HID connection + raw connection + 1 pending-adv pre-alloc
# headroom (Zephyr pre-allocates a bt_conn when starting connectable adv).
CONFIG_BT_MAX_CONN=3

# FPU — required for float math in imu_mouse.c across thread contexts
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Logging
CONFIG_LOG=y
CONFIG_BT_LOG_LEVEL_WRN=y
CONFIG_LOG_PRINTK=n

# Float support in printk / LOG (required for %f in debug output)
CONFIG_CBPRINTF_FP_SUPPORT=y
